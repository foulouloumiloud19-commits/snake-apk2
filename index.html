<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOULOLOU MILOUD'S RIVAL CENTIPEDE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0b0e14;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 52%;
      background: #203c0e;
      display: block;
    }
    #panel {
      width: 100%;
      height: 48%;
      background: #0b0e14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      border-top: 2px solid #121a26;
      position: relative;
    }
    /* أزرار التحكم باللمس */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-gap: 8px;
    }
    .btn {
      width: 65px;
      height: 65px;
      background: #182232;
      color: #00f0ff;
      border: 2px solid #00b4ff;
      border-radius: 14px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 240, 255, 0.2);
    }
    .btn:active {
      background: #00b4ff;
      color: #fff;
      transform: scale(0.94);
    }
    .empty { visibility: hidden; }
    .action-row {
      display: flex;
      gap: 12px;
      width: 90%;
      justify-content: center;
    }
    .act-btn {
      padding: 10px 18px;
      border-radius: 10px;
      background: #141824;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .act-btn:active { background: #00f0ff; color: #000; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="400" height="420"></canvas>
  
  <div id="panel">
    <div class="action-row">
      <button class="act-btn" onclick="toggleSkin()">الجلد: <span id="skin-label">1/16</span></button>
      <button class="act-btn" onclick="triggerBoost()">🚀 سرعة صاروخية</button>
      <button class="act-btn" onclick="resetGame()">إعادة البدء</button>
    </div>

    <!-- لوحة التحكم بالاتجاهات -->
    <div class="dpad">
      <div class="empty"></div>
      <div class="btn" ontouchstart="handleDir('UP')" onclick="handleDir('UP')">⬆️</div>
      <div class="empty"></div>
      <div class="btn" ontouchstart="handleDir('LEFT')" onclick="handleDir('LEFT')">⬅️</div>
      <div class="btn" ontouchstart="handleDir('DOWN')" onclick="handleDir('DOWN')">⬇️</div>
      <div class="btn" ontouchstart="handleDir('RIGHT')" onclick="handleDir('RIGHT')">➡️</div>
    </div>
  </div>
</div>

<script>
// --- مشغل الصوتيات التخليقية Web Audio API (مطابق للبايثون) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
}

function playTone(startFreq, endFreq, duration, vol=0.3) {
  try {
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

const sounds = {
  eat: () => playTone(450, 950, 0.08, 0.25),
  hunt: () => playTone(600, 1300, 0.15, 0.35),
  quest: () => playTone(500, 1500, 0.30, 0.40),
  gameover: () => playTone(350, 100, 0.40, 0.40),
  boost: () => playTone(300, 1400, 0.25, 0.35)
};

// اهتزاز الهاتف
function vibratePhone(ms=80) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// --- بيانات وإعدادات اللعبة ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const SNAKE_SKINS = [
  { name: "1/16 NEON GREEN", dark: "#0a9628", light: "#1eff5a", glow: "#8cffa0" },
  { name: "2/16 ULTRA CYAN", dark: "#008cbe", light: "#00f0ff", glow: "#aafafe" },
  { name: "3/16 HYPER ORANGE", dark: "#be3200", light: "#ff7800", glow: "#ffc85a" },
  { name: "7/16 CRIMSON BLOOD", dark: "#aa0a23", light: "#ff2855", glow: "#ff82a0" },
  { name: "11/16 MAGMA LAVA", dark: "#b4280a", light: "#ff6414", glow: "#ffbe50" }
];
let currentSkinIdx = 0;

let score = 0;
let coins = 0;
let highScore = localStorage.getItem("centipede_high") || 0;
let dir = { x: 1, y: 0 };
let snake = [];
const box = 14;

let quest = { desc: "اصطد 2 أرانب", type: "RABBIT", target: 2, count: 0 };
let questBanner = "";
let questBannerTimer = 0;

// البركة المائية
let pond = { x: 120, y: 220, w: 160, h: 90 };
let waterTick = 0;

// الأشجار
const trees = [
  { x: 50, y: 80, r: 24 },
  { x: 350, y: 80, r: 26 },
  { x: 60, y: 350, r: 22 },
  { x: 340, y: 340, r: 24 }
];

// الحيوانات
let animals = [];
function spawnAnimal() {
  const types = ['RABBIT', 'MOUSE', 'SQUIRREL'];
  let t = types[Math.floor(Math.random() * types.length)];
  animals.push({
    type: t,
    x: Math.random() * (canvas.width - 60) + 30,
    y: Math.random() * (canvas.height - 120) + 60,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    size: t === 'SQUIRREL' ? 12 : 9,
    color: t === 'RABBIT' ? '#ffffff' : (t === 'SQUIRREL' ? '#e66e1e' : '#a09ba5')
  });
}

// طعام
let food = { x: 200, y: 150 };

function resetGame() {
  snake = [
    { x: 100, y: 150 },
    { x: 86, y: 150 },
    { x: 72, y: 150 },
    { x: 58, y: 150 }
  ];
  dir = { x: 1, y: 0 };
  score = 0;
  animals = [];
  for (let i = 0; i < 3; i++) spawnAnimal();
}

function handleDir(d) {
  initAudio();
  if (d === 'UP' && dir.y === 0) dir = { x: 0, y: -1 };
  if (d === 'DOWN' && dir.y === 0) dir = { x: 0, y: 1 };
  if (d === 'LEFT' && dir.x === 0) dir = { x: -1, y: 0 };
  if (d === 'RIGHT' && dir.x === 0) dir = { x: 1, y: 0 };
}

function toggleSkin() {
  currentSkinIdx = (currentSkinIdx + 1) % SNAKE_SKINS.length;
  document.getElementById("skin-label").innerText = SNAKE_SKINS[currentSkinIdx].name.split(" ")[0];
}

function triggerBoost() {
  sounds.boost();
  vibratePhone(120);
  questBanner = "🚀 وضع السرعة مفعل!";
  questBannerTimer = 40;
}

// السحب عبر الشاشة
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - touchStartX;
  let dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) handleDir('RIGHT');
    else if (dx < -30) handleDir('LEFT');
  } else {
    if (dy > 30) handleDir('DOWN');
    else if (dy < -30) handleDir('UP');
  }
});

// --- حلقة الرسم والتحديث ---
function update() {
  waterTick += 0.05;

  let head = { x: snake[0].x + dir.x * box, y: snake[0].y + dir.y * box };

  // الحدود
  if (head.x < 0) head.x = canvas.width - box;
  if (head.x >= canvas.width) head.x = 0;
  if (head.y < 0) head.y = canvas.height - box;
  if (head.y >= canvas.height) head.y = 0;

  // أكل التفاح
  if (Math.hypot(head.x - food.x, head.y - food.y) < 14) {
    score += 10;
    sounds.eat();
    vibratePhone(40);
    food = {
      x: Math.random() * (canvas.width - 40) + 20,
      y: Math.random() * (canvas.height - 40) + 20
    };
  } else {
    snake.pop();
  }

  // صيد الحيوانات وهروبها
  animals.forEach((a, i) => {
    let dSnake = Math.hypot(a.x - head.x, a.y - head.y);
    if (dSnake < 90) { // تهرب عند الاقتراب
      a.x += (a.x - head.x) * 0.06;
      a.y += (a.y - head.y) * 0.06;
    } else {
      a.x += a.vx;
      a.y += a.vy;
    }

    // الصيد
    if (dSnake < 16) {
      sounds.hunt();
      vibratePhone(90);
      score += 25;
      coins += 5;
      if (quest.type === a.type) {
        quest.count++;
        if (quest.count >= quest.target) {
          sounds.quest();
          vibratePhone(200);
          coins += 50;
          questBanner = "اكتملت المهمة! +50 كوينز";
          questBannerTimer = 60;
          quest.count = 0;
        }
      }
      animals.splice(i, 1);
      spawnAnimal();
    }

    if (a.x < 10 || a.x > canvas.width - 10) a.vx *= -1;
    if (a.y < 10 || a.y > canvas.height - 10) a.vy *= -1;
  });

  snake.unshift(head);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("centipede_high", highScore);
  }
}

function draw() {
  // خلفية العشب
  ctx.fillStyle = "#203c0e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // رسم البركة المائية المتحركة
  ctx.fillStyle = "#1e5028";
  ctx.beginPath();
  ctx.ellipse(pond.x, pond.y, pond.w/2 + 6, pond.h/2 + 6, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#145a82";
  ctx.beginPath();
  ctx.ellipse(pond.x, pond.y, pond.w/2, pond.h/2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#8ce6ff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(pond.x, pond.y, (pond.w/2 - 10) + Math.sin(waterTick)*6, (pond.h/2 - 8) + Math.cos(waterTick)*4, 0, 0, Math.PI*2);
  ctx.stroke();

  // رسم الأشجار
  trees.forEach(tr => {
    ctx.fillStyle = "#103a16";
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#226a28";
    ctx.beginPath();
    ctx.arc(tr.x - 3, tr.y - 3, tr.r * 0.7, 0, Math.PI*2);
    ctx.fill();
  });

  // رسم الحيوانات
  animals.forEach(a => {
    ctx.fillStyle = a.color;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.size, 0, Math.PI*2);
    ctx.fill();
    // أذنان للأرنب
    if (a.type === 'RABBIT') {
      ctx.fillStyle = "#ff8ca0";
      ctx.fillRect(a.x - 3, a.y - 12, 2, 5);
      ctx.fillRect(a.x + 1, a.y - 12, 2, 5);
    }
  });

  // رسم التفاحة
  ctx.fillStyle = "#ff3232";
  ctx.beginPath();
  ctx.arc(food.x, food.y, 7, 0, Math.PI*2);
  ctx.fill();

  // رسم الثعبان (الحريشة Centipede) بالجلد المختار
  let skin = SNAKE_SKINS[currentSkinIdx];
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? skin.light : skin.dark;
    ctx.beginPath();
    ctx.arc(seg.x + box/2, seg.y + box/2, box/2 + (i===0?1:-1), 0, Math.PI*2);
    ctx.fill();

    if (i === 0) { // أعين للرأس
      ctx.fillStyle = "#fff";
      ctx.fillRect(seg.x + 3, seg.y + 3, 3, 3);
      ctx.fillRect(seg.x + 8, seg.y + 3, 3, 3);
    }
  });

  // شريط الرأس والبيانات
  ctx.fillStyle = "rgba(11, 14, 20, 0.85)";
  ctx.fillRect(0, 0, canvas.width, 36);
  ctx.fillStyle = "#00f0ff";
  ctx.font = "bold 13px Arial";
  ctx.fillText(`النقاط: ${score}`, 12, 22);
  ctx.fillText(`الكوينز: 🪙 ${coins}`, 120, 22);
  ctx.fillText(`أعلى سكور: ${highScore}`, 240, 22);

  // شريط المهمة والتنبيهات
  if (questBannerTimer > 0) {
    questBannerTimer--;
    ctx.fillStyle = "rgba(0, 240, 255, 0.9)";
    ctx.fillRect(30, 45, canvas.width - 60, 26);
    ctx.fillStyle = "#000";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(questBanner, canvas.width / 2, 62);
    ctx.textAlign = "start";
  }
}

resetGame();
setInterval(() => {
  update();
  draw();
}, 100);
</script>
</body>
</html>
