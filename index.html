}

const TAU=Math.PI*2,rand=(a,b)=>Math.random()*(b-a)+a,ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

const SNAKE_SKINS=[["1/50 Earthworm",[119, 21, 21],[255, 77, 77],[255, 166, 166],1],["2/50 Nightcrawler",[119, 33, 21],[255, 98, 77],[255, 176, 166],1],["3/50 Red Wiggler",[119, 44, 21],[255, 119, 77],[255, 187, 166],1],["4/50 Compost Worm",[119, 56, 21],[255, 141, 77],[255, 198, 166],1],["5/50 Brandling",[119, 68, 21],[255, 162, 77],[255, 209, 166],1],["6/50 European Nightcrawler",[119, 79, 21],[255, 184, 77],[255, 219, 166],1],["7/50 African Nightcrawler",[119, 91, 21],[255, 205, 77],[255, 230, 166],1],["8/50 Blue Worm",[119, 104, 21],[255, 226, 77],[255, 241, 166],1],["9/50 Dendrobaena",[119, 115, 21],[255, 248, 77],[255, 251, 166],1],["10/50 Lumbricus",[111, 119, 21],[241, 255, 77],[248, 255, 166],1],["11/50 Eisenia Fetida",[99, 119, 21],[219, 255, 77],[237, 255, 166],1],["12/50 Eisenia Hortensis",[87, 119, 21],[198, 255, 77],[226, 255, 166],1],["13/50 Garden Earthworm",[76, 119, 21],[176, 255, 77],[216, 255, 166],1],["14/50 Field Worm",[64, 119, 21],[155, 255, 77],[205, 255, 166],1],["15/50 Leaf Litter Worm",[52, 119, 21],[134, 255, 77],[194, 255, 166],1],["16/50 Woodland Worm",[40, 119, 21],[112, 255, 77],[184, 255, 166],1],["17/50 Red Earthworm",[29, 119, 21],[91, 255, 77],[173, 255, 166],1],["18/50 Green Worm",[21, 119, 25],[77, 255, 84],[166, 255, 169],1],["19/50 Golden Worm",[21, 119, 37],[77, 255, 105],[166, 255, 180],1],["20/50 Copper Worm",[21, 119, 48],[77, 255, 126],[166, 255, 191],1],["21/50 Ragworm",[21, 119, 60],[77, 255, 148],[166, 255, 201],2],["22/50 Sandworm",[21, 119, 72],[77, 255, 169],[166, 255, 212],2],["23/50 Lugworm",[21, 119, 83],[77, 255, 191],[166, 255, 223],2],["24/50 Bristle Worm",[21, 119, 95],[77, 255, 212],[166, 255, 234],2],["25/50 Fireworm",[21, 119, 107],[77, 255, 234],[166, 255, 244],2],["26/50 Scale Worm",[21, 119, 119],[77, 255, 255],[166, 255, 255],2],["27/50 Feather Duster Worm",[21, 107, 119],[77, 234, 255],[166, 244, 255],2],["28/50 Fan Worm",[21, 95, 119],[77, 212, 255],[166, 234, 255],2],["29/50 Tube Worm",[21, 83, 119],[77, 191, 255],[166, 223, 255],2],["30/50 Parchment Worm",[21, 72, 119],[77, 169, 255],[166, 212, 255],2],["31/50 Spaghetti Worm",[21, 60, 119],[77, 148, 255],[166, 201, 255],3],["32/50 Serpulid Worm",[21, 48, 119],[77, 126, 255],[166, 191, 255],3],["33/50 Sabellid Worm",[21, 37, 119],[77, 105, 255],[166, 180, 255],3],["34/50 Christmas Tree Worm",[21, 25, 119],[77, 84, 255],[166, 169, 255],3],["35/50 Calcareous Tube Worm",[29, 21, 119],[91, 77, 255],[173, 166, 255],3],["36/50 Mud Tube Worm",[40, 21, 119],[112, 77, 255],[184, 166, 255],3],["37/50 Palolo Worm",[52, 21, 119],[134, 77, 255],[194, 166, 255],3],["38/50 Marine Bristleworm",[64, 21, 119],[155, 77, 255],[205, 166, 255],3],["39/50 Bobbit Worm",[76, 21, 119],[176, 77, 255],[216, 166, 255],4],["40/50 Syllid Worm",[87, 21, 119],[198, 77, 255],[226, 166, 255],4],["41/50 Leech",[99, 21, 119],[219, 77, 255],[237, 166, 255],4],["42/50 Medicinal Leech",[111, 21, 119],[241, 77, 255],[248, 166, 255],4],["43/50 Horse Leech",[119, 21, 115],[255, 77, 248],[255, 166, 251],4],["44/50 Freshwater Leech",[119, 21, 104],[255, 77, 226],[255, 166, 241],4],["45/50 Ribbon Leech",[119, 21, 91],[255, 77, 205],[255, 166, 230],5],["46/50 Polychaete",[119, 21, 79],[255, 77, 184],[255, 166, 219],5],["47/50 Segmented Marine Worm",[119, 21, 68],[255, 77, 162],[255, 166, 209],5],["48/50 Burrowing Worm",[119, 21, 56],[255, 77, 141],[255, 166, 198],5],["49/50 Velvet-looking Worm",[119, 21, 44],[255, 77, 119],[255, 166, 187],5],["50/50 Centipede Worm",[119, 21, 33],[255, 77, 98],[255, 166, 176],5]];

const FORM_TYPES=[
  ['earth','Earthworm'],['night','Nightcrawler'],['caterpillar','Caterpillar'],['millipede','Millipede'],['centipede','Centipede'],
  ['slug','Slug'],['leech','Leech'],['larva','Larva'],['ribbon','Ribbon Worm'],['velvet','Velvet Worm']
];
function wormForm(i){
  const n=((i%50)+50)%50, family=Math.floor(n/5), variant=n%5, type=FORM_TYPES[family];
  const profiles=[
    {scale:.82,head:.96,ring:.30,thick:.88,crest:0,bristle:false,spots:false},
    {scale:.88,head:1.02,ring:.44,thick:1.00,crest:0,bristle:false,spots:true},
    {scale:.94,head:1.08,ring:.58,thick:1.12,crest:1,bristle:false,spots:true},
    {scale:1.00,head:1.14,ring:.72,thick:1.20,crest:2,bristle:true,spots:false},
    {scale:1.07,head:1.20,ring:.88,thick:1.30,crest:3,bristle:true,spots:true}
  ][variant];
  return {family:type[0],label:type[1]+` ${variant+1}`,variant,scale:profiles.scale,head:profiles.head,ring:profiles.ring,thick:profiles.thick,bristle:profiles.bristle,spots:profiles.spots,crest:profiles.crest};
}

function drawMiniWorm(i,cx,cy,sc=1){
  const f=wormForm(i), sk=SNAKE_SKINS[i], dark=`rgb(${sk[1]})`, light=`rgb(${sk[2]})`, glow=`rgb(${sk[3]})`;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
  const body=8;
  for(let k=0;k<body;k++){
    let t=k/(body-1),x=-24+t*48,y=Math.sin(t*Math.PI*2)*2.5;
    ctx.fillStyle=dark;ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();
    ctx.strokeStyle=glow;ctx.lineWidth=1;ctx.stroke();
  }
  ctx.fillStyle=light;ctx.beginPath();ctx.arc(26,0,8,0,TAU);ctx.fill();
  ctx.restore();
}

function drawCreatureSegment(f,x,y,r,a,dark,light,glow){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  const v=f.variant, t=f.thick||1;
  ctx.fillStyle=`rgb(${dark})`;ctx.beginPath();ctx.ellipse(0,0,r*1.1*t,r*.85,0,0,TAU);ctx.fill();
  ctx.strokeStyle=`rgb(${glow})`;ctx.lineWidth=1.5;ctx.stroke();
  if(f.spots||f.ring>.5){ctx.fillStyle=`rgb(${light})`;ctx.beginPath();ctx.arc(0,0,r*.4,0,TAU);ctx.fill();}
  if(f.bristle||f.crest){
    ctx.strokeStyle=`rgb(${glow})`;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(0,-r*.8);ctx.lineTo(0,-r*1.3);ctx.moveTo(0,r*.8);ctx.lineTo(0,r*1.3);ctx.stroke();
  }
  ctx.restore();
}

function currentStageNumber(){return Math.max(1,Math.min(5,typeof stage!=="undefined"?stage:1));}
function skinUnlocked(i){return SNAKE_SKINS[i][4]<=currentStageNumber();}
function nextUnlockedSkin(step=1){let i=selectedColor;for(let n=0;n<SNAKE_SKINS.length;n++){i=(i+step+SNAKE_SKINS.length)%SNAKE_SKINS.length;if(skinUnlocked(i))return i;}return selectedColor;}
function saveWormTeam(){try{localStorage.setItem("centipede_worm_team",JSON.stringify({size:wormTeamSize,team:wormTeam,player:playerWormIndex}));}catch(_){} }
function loadWormTeam(){try{let x=JSON.parse(localStorage.getItem("centipede_worm_team")||"null");if(x&&Array.isArray(x.team)){wormTeamSize=x.size===7?7:5;wormTeam=[...new Set(x.team.map(Number).filter(i=>i>=0&&i<50))].slice(0,wormTeamSize);playerWormIndex=Number(x.player)||0;} }catch(_){} if(wormTeam.length<wormTeamSize){for(let i=0;i<50&&wormTeam.length<wormTeamSize;i++)if(!wormTeam.includes(i))wormTeam.push(i);}if(!wormTeam.includes(playerWormIndex))playerWormIndex=wormTeam[0]??0;selectedColor=playerWormIndex;saveWormTeam();}
function normalizeWormTeam(){
  wormTeam=[...new Set((Array.isArray(wormTeam)?wormTeam:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<50))];
  if(!wormTeam.length)wormTeam=[0,1,2,3,4];
  while(wormTeam.length<5){let q=0;while(wormTeam.includes(q))q++;wormTeam.push(q);}
  if(wormTeam.length>5)wormTeam=wormTeam.slice(0,5);
  if(!wormTeam.includes(playerWormIndex))playerWormIndex=wormTeam[0];
  selectedColor=playerWormIndex;
}

const SPEED_LEVELS=["SPEED: 1x (SLOW)","SPEED: 2x (NORMAL)","SPEED: 3x (FAST)","SPEED: 4x (TURBO)"];
const CONTROL_MODES=["CTRL: BUTTONS","CTRL: SWIPE","CTRL: GYRO"],CONTROL_SHORT=["PAD","SWIPE","GYRO"];
const OBJECT_MODE_NAMES=["OBJECTS: ALL ON","OBJECTS: WALLS","OBJECTS: CHASER","OBJECTS: PETS","OBJECTS: OFF"];
const DIFFICULTY_MODES=["DIFF: EASY (5 LIVES)","DIFF: NORMAL (3 LIVES)","DIFF: HARD (2 LIVES)","DIFF: EXTREME (1 LIFE)"];
let selectedColor=0,selectedSpeed=1,selectedControl=0,selectedObjects=0,selectedDiff=1;
let language=localStorage.getItem("centipede_lang")||"en";
let wormTeamSize=5,wormTeam=[0,1,2,3,4],playerWormIndex=0,wormPickerOpen=false;
let speedPercent=50,speedMenuOpen=false,frameFactor=1;
let inMenu=false,paused=false,resumeFromMenu=false,timer=0,highScore=+localStorage.getItem("centipede_high")||0,totalCoins=+localStorage.getItem("centipede_coins")||0;
const MUSIC_TRACKS=["MEADOW DRIVE","VALLEY RUN","FOREST CHASE","RIVER RUSH","CANYON BEAT","SUNRISE TRAIL"];
let selectedMusicTrack=0,musicEnabled=true,sfxEnabled=true,audioCtx=null;

function playFx(n){
  if(!sfxEnabled)return;
  const m={startgame:[520,1040,.18],oneup:[700,1400,.22],highscore:[440,1320,.28],gameover:[320,90,.45],poison:[180,80,.16],donut:[420,900,.10]}[n];
  if(m)sound(...m,.18);
}
function sound(f1,f2,d=.10,vol=.14){
  if(!sfxEnabled)return;
  try{
    audioCtx??=new (AudioContext||webkitAudioContext)();
    let o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.setValueAtTime(f1,audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f2,audioCtx.currentTime+d);
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function vibrate(ms=60){if(navigator.vibrate)navigator.vibrate(ms)}

let pond={x:W*.28,y:GAME_HEIGHT*.54,w:W*.44,h:GAME_HEIGHT*.26};
let particles=[],animals=[],power={x:-100,y:-100,type:"REPULSE",active:false,timer:160,duration:340};
let freeze=0,shield=0,magnet=0,doublePts=0,repulse=0;

function createAnimal(){
  let t=["RABBIT","MOUSE","SQUIRREL"][ri(0,2)],z=t==="RABBIT"?13:t==="SQUIRREL"?14:10;
  return{x:rand(45,W-45),y:rand(HEADER_HEIGHT+25,GAME_HEIGHT-45),angle:rand(0,TAU),speed:rand(.5,.8),turn:ri(60,180),type:t,size:z,body:t==="RABBIT"?[245,245,245]:t==="SQUIRREL"?[220,115,35]:[155,155,160]};
}
for(let i=0;i<3;i++)animals.push(createAnimal());

function emit(x,y,c,n=4){
  if(particles.length>18)particles.splice(0,particles.length-18);
  for(let i=0;i<n;i++){
    let a=rand(0,TAU),s=rand(1.5,3.2);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2.5,c,life:10});
  }
}

let stage=1,stageBanner=0,stageBannerText="",stageBannerSub="";
let apple=[W*.5,GAME_HEIGHT*.38],appleColor=0;
function respawnApple(){apple=[ri(40,W-40),ri(HEADER_HEIGHT+25,GAME_HEIGHT-40)];appleColor=ri(0,4)}

function drawWorld(){
  ctx.fillStyle="#122417";
  ctx.fillRect(0,0,W,GAME_HEIGHT);
  // رسم الطريق
  ctx.strokeStyle="#473620";ctx.lineWidth=W*.15;
  ctx.beginPath();ctx.moveTo(-10,GAME_HEIGHT*.70);ctx.lineTo(W*.34,GAME_HEIGHT*.58);ctx.lineTo(W*.68,GAME_HEIGHT*.62);ctx.lineTo(W+10,GAME_HEIGHT*.34);ctx.stroke();
  // رسم البركة
  ctx.fillStyle="#382d18";ctx.beginPath();ctx.ellipse(pond.x+pond.w/2,pond.y+pond.h/2,pond.w/2+6,pond.h/2+4,0,0,TAU);ctx.fill();
  ctx.fillStyle="#104e76";ctx.beginPath();ctx.ellipse(pond.x+pond.w/2,pond.y+pond.h/2,pond.w/2,pond.h/2,0,0,TAU);ctx.fill();
}

function drawApple(){
  ctx.fillStyle="#ff3333";
  ctx.beginPath();ctx.arc(apple[0],apple[1],12,0,TAU);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(apple[0]-3,apple[1]-4,3,0,TAU);ctx.fill();
}

class Rival{
  constructor(){this.reset()}
  reset(){
    let x=Math.random()<.5?30:W-30,y=rand(HEADER_HEIGHT+35,GAME_HEIGHT-70);
    this.points=Array.from({length:14},(_,i)=>[x,y+i*7]);
    this.angle=rand(0,TAU);this.speed=1.5;this.alive=true;this.respawn=0;
  }
  kill(){this.alive=false;this.respawn=180;}
  update(){
    if(!this.alive){if((this.respawn-=frameFactor)<=0)this.reset();return;}
    let [hx,hy]=this.points[0];
    let ta=Math.atan2(apple[1]-hy,apple[0]-hx);
    let df=(ta-this.angle+Math.PI)%TAU-Math.PI;
    this.angle+=df*.14;
    let nx=clamp(hx+Math.cos(this.angle)*this.speed*frameFactor,15,W-15);
    let ny=clamp(hy+Math.sin(this.angle)*this.speed*frameFactor,HEADER_HEIGHT+15,GAME_HEIGHT-15);
    if(dist(nx,ny,apple[0],apple[1])<18){respawnApple();playFx("donut");}
    this.points.unshift([nx,ny]);this.points.pop();
  }
  draw(){
    if(!this.alive)return;
    ctx.fillStyle="#b81d32";
    for(let i=this.points.length-1;i>=0;i--){
      ctx.beginPath();ctx.arc(this.points[i][0],this.points[i][1],6,0,TAU);ctx.fill();
    }
  }
}
let rivals=[new Rival(),new Rival()];

class Snake{
  constructor(){this.reset()}
  reset(){
    let x=W/2,y=GAME_HEIGHT*.32;
    this.points=Array.from({length:28},(_,i)=>[x,y+i*7]);
    this.angle=-Math.PI/2;this.target=this.angle;
    this.score=0;this.alive=true;this.boost=0;this.hits=0;this.maxLives=[5,3,2,1][selectedDiff];
    this.inv=0;this.speedVal=2.8;
  }
  update(){
    if(!this.alive||paused)return;
    if(this.inv)this.inv-=frameFactor;
    if(this.boost)this.boost-=frameFactor;
    this.angle=this.target;
    let sp=(this.speedVal*(this.boost?1.7:1))*frameFactor;
    let [ox,oy]=this.points[0];
    let hx=ox+Math.cos(this.angle)*sp,hy=oy+Math.sin(this.angle)*sp;
    
    if(hx<14||hx>W-14||hy<HEADER_HEIGHT+14||hy>GAME_HEIGHT-14){
      this.hits++;this.inv=35;vibrate(90);playFx("poison");
      if(this.hits>=this.maxLives){this.alive=false;playFx("gameover");return;}
      hx=clamp(hx,20,W-20);hy=clamp(hy,HEADER_HEIGHT+20,GAME_HEIGHT-20);
    }
    
    for(let rv of rivals){
      if(rv.alive&&dist(hx,hy,rv.points[0][0],rv.points[0][1])<20){
        rv.kill();this.score+=15;totalCoins+=20;emit(hx,hy,[255,100,255],6);playFx("highscore");break;
      }
    }

    this.points.unshift([hx,hy]);this.points.pop();

    if(dist(hx,hy,apple[0],apple[1])<18){
      this.score+=10;totalCoins+=2;
      this.points.push(this.points[this.points.length-1].slice());
      playFx("donut");emit(apple[0],apple[1],[255,200,50],6);respawnApple();
    }
  }
  draw(){
    let sk=SNAKE_SKINS[selectedColor];
    let f=wormForm(playerWormIndex);
    let pts=this.points;
    ctx.fillStyle=`rgb(${sk[1]})`;
    for(let i=pts.length-1;i>0;i-=2){
      ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],7.5*f.scale,0,TAU);ctx.fill();
    }
    ctx.fillStyle=`rgb(${sk[2]})`;
    ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],10.5*f.scale,0,TAU);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(pts[0][0]-2,pts[0][1]-3,2.5,0,TAU);ctx.fill();
  }
}
let snake=new Snake();

function controlLayout(){
  const panelTop=GAME_HEIGHT, ph=PANEL_HEIGHT;
  return {
    dc:[Math.floor(W*.50),panelTop+ph*.62],
    dpadR:78, dpadOffset:50,
    menu:[Math.floor(W*.18),panelTop+ph*.18],
    skin:[Math.floor(W*.82),panelTop+ph*.18]
  };
}

function panel(){
  ctx.fillStyle="#090d14";ctx.fillRect(0,GAME_HEIGHT,W,PANEL_HEIGHT);
  ctx.strokeStyle="#1a2b3c";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,GAME_HEIGHT);ctx.lineTo(W,GAME_HEIGHT);ctx.stroke();

  const L=controlLayout();
  ctx.fillStyle="#122336";ctx.beginPath();ctx.arc(L.dc[0],L.dc[1],L.dpadR,0,TAU);ctx.fill();
  ctx.strokeStyle="#38bdf8";ctx.lineWidth=3.5;ctx.stroke();

  const o=L.dpadOffset;
  const dirs=[[L.dc[0],L.dc[1]-o,"▲"],[L.dc[0],L.dc[1]+o,"▼"],[L.dc[0]-o,L.dc[1],"◀"],[L.dc[0]+o,L.dc[1],"▶"]];
  ctx.fillStyle="#38bdf8";ctx.font="bold 26px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  for(let [x,y,t] of dirs){ctx.fillText(t,x,y);}

  // الأزرار العلوية
  const ar=language==="ar";
  ctx.fillStyle="#d69b08";ctx.fillRect(L.menu[0]-40,L.menu[1]-18,80,36);
  ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.fillText(ar?"القائمة":"MENU",L.menu[0],L.menu[1]);

  let sk=SNAKE_SKINS[selectedColor];
  ctx.fillStyle=`rgb(${sk[2]})`;ctx.fillRect(L.skin[0]-40,L.skin[1]-18,80,36);
  ctx.fillStyle="#000";ctx.fillText(ar?"دودة":"WORM",L.skin[0],L.skin[1]);
}

function hud(){
  ctx.fillStyle="#0c1018";ctx.fillRect(0,0,W,HEADER_HEIGHT);
  ctx.fillStyle="#31d8a8";ctx.font="bold 17px Arial";ctx.textAlign="left";
  ctx.fillText("FOULOLOU MILOUD",15,30);
  ctx.fillStyle="#ffd95a";ctx.fillText(`SCORE: ${snake.score}`,15,64);
  ctx.textAlign="right";ctx.fillStyle="#fff";
  ctx.fillText(`LIVES: ${Math.max(0,snake.maxLives-snake.hits)}`,W-15,64);
}

function update(){
  snake.update();
  for(let r of rivals)r.update();
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--;}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(inMenu){menu();}
  else{
    drawWorld();
    drawApple();
    for(let r of rivals)r.draw();
    snake.draw();
    for(let p of particles){
      ctx.fillStyle=`rgb(${p.c})`;ctx.fillRect(p.x,p.y,p.r,p.r);
    }
    hud();
    panel();
    if(!snake.alive){
      ctx.fillStyle="#ff2828";ctx.font="bold 44px Arial";ctx.textAlign="center";
      ctx.fillText("GAME OVER",W/2,GAME_HEIGHT/2);
      ctx.fillStyle="#fff";ctx.font="18px Arial";ctx.fillText("TAP TO RETRY",W/2,GAME_HEIGHT/2+38);
    }
  }
}

function menu(){
  ctx.fillStyle="#0b1220";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#2bd99b";ctx.font="bold 22px Arial";ctx.textAlign="center";
  ctx.fillText("FOULOLOU MILOUD'S CENTIPEDE",W/2,60);
  ctx.fillStyle="#00b450";ctx.fillRect(W/2-110,120,220,48);
  ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("START GAME",W/2,148);
  ctx.fillStyle="#a51f5d";ctx.fillRect(W/2-110,185,220,48);
  ctx.fillStyle="#fff";ctx.fillText(`SKIN: ${selectedColor+1}/50`,W/2,213);
}

// قفل ثابت عند 30 FPS لتخفيف عبء المعالج تماماً
let lastTime=performance.now();
const FRAME_TIME=1000/30;

function loop(currentTime){
  requestAnimationFrame(loop);
  const delta=currentTime-lastTime;
  if(delta>=FRAME_TIME){
    lastTime=currentTime-(delta%FRAME_TIME);
    frameFactor=1;
    timer+=0.04;
    update();
    draw();
  }
}

function requestDirection(a){
  const d=(a-snake.angle+Math.PI)%TAU-Math.PI;
  if(Math.cos(d)<-0.2)return;
  snake.target=a;
}

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  let r=canvas.getBoundingClientRect();
  let mx=(e.clientX-r.left)*(W/r.width);
  let my=(e.clientY-r.top)*(H/r.height);

  if(inMenu){
    if(mx>=W/2-110&&mx<=W/2+110){
      if(my>=120&&my<=168){inMenu=false;snake.reset();playFx("startgame");}
      else if(my>=185&&my<=233){selectedColor=(selectedColor+1)%SNAKE_SKINS.length;playerWormIndex=selectedColor;}
    }
    return;
  }

  if(!snake.alive){snake.reset();return;}
  const L=controlLayout();
  if(dist(mx,my,...L.menu)<40){inMenu=true;return;}
  if(dist(mx,my,...L.skin)<40){selectedColor=(selectedColor+1)%SNAKE_SKINS.length;playerWormIndex=selectedColor;return;}

  const o=L.dpadOffset;
  if(dist(mx,my,L.dc[0],L.dc[1]-o)<42)requestDirection(-Math.PI/2);
  else if(dist(mx,my,L.dc[0],L.dc[1]+o)<42)requestDirection(Math.PI/2);
  else if(dist(mx,my,L.dc[0]-o,L.dc[1])<42)requestDirection(Math.PI);
  else if(dist(mx,my,L.dc[0]+o,L.dc[1])<42)requestDirection(0);
});

window.addEventListener("load",()=>{loadWormTeam();normalizeWormTeam();requestAnimationFrame(loop)});
</script>
