function drawStageTransitionSnake(){

  const scale=1.42,scaledW=Math.max(1,(maxX-minX)*scale);

  const eased=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const fromX=-scaledW-160,toX=W+160,tx=fromX+(toX-fromX)*eased-minX*scale;

}

function draw(){ctx.clearRect(0,0,W,H);if(inMenu){if(wormPickerOpen)drawWormPicker();else menu();}else{drawWorld();drawPond();drawWaterDetails();drawTerrainDetails();for(let t of trees())drawTree(...t);if(selectedObjects===0||selectedObjects===1)drawWalls();if(selectedObjects===0||selectedObjects===3)animals.forEach(drawAnimal);if((selectedObjects===0||selectedObjects===2)&&chaser.visible){ctx.fillStyle="#f33";ctx.beginPath();ctx.arc(chaser.x,chaser.y,14,0,TAU);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(chaser.x,chaser.y,4,0,TAU);ctx.fill()}drawPower();drawApple();forEachRival(r=>r.draw());if(stageTransition>0){drawStageTransitionSnake();}else{snake.draw();}drawParticles();hud();panel();if(scoreFlash>0){ctx.fillStyle="#ffd700";ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.fillText("+10",W/2,GAME_HEIGHT+108)}if(stageTransition>0){ctx.save();let a=Math.sin(Math.min(1,stageTransitionProgress)*Math.PI);ctx.fillStyle=`rgba(4,8,18,${.30+.45*a})`;ctx.fillRect(0,HEADER_HEIGHT,W,GAME_HEIGHT-HEADER_HEIGHT);ctx.globalAlpha=.9;ctx.fillStyle=STAGES[stageTransitionFrom-1].accent;ctx.font="bold 28px Arial";ctx.textAlign="center";ctx.fillText("CROSSING TO A NEW WORLD",W/2,GAME_HEIGHT*.42);ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.fillText(`STAGE ${stageTransitionTo} • ${STAGES[stageTransitionTo-1].name}`,W/2,GAME_HEIGHT*.42+32);ctx.font="bold 13px Arial";ctx.fillText("The worm is adapting to the new environment…",W/2,GAME_HEIGHT*.42+56);ctx.restore();}if(stageBanner>0){stageBanner--;let a=Math.min(1,stageBanner/35);ctx.save();ctx.globalAlpha=a;ctx.fillStyle="rgba(5,10,18,.92)";roundRect(45,HEADER_HEIGHT+75,W-90,88,18,true);ctx.strokeStyle=STAGES[stage-1].accent;ctx.lineWidth=3;roundRect(45,HEADER_HEIGHT+75,W-90,88,18,false);ctx.fillStyle=STAGES[stage-1].accent;ctx.font="bold 25px Arial";ctx.textAlign="center";ctx.fillText(stageBannerText,W/2,HEADER_HEIGHT+111);ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.fillText(stageBannerSub,W/2,HEADER_HEIGHT+137);ctx.restore()}if(lvlTimer>0){lvlTimer--;let target=W/2-W*.44;lvlX+=(target-lvlX)*.18;ctx.fillStyle="rgba(16,26,42,.8)";roundRect(lvlX,HEADER_HEIGHT+6,W*.88,50,12,true);ctx.strokeStyle="#ffd700";ctx.stroke();ctx.textAlign="center";ctx.fillStyle="#ffeb32";ctx.font="bold 22px Arial";ctx.fillText(lvlText,lvlX+W*.44,HEADER_HEIGHT+27);ctx.fillStyle="#00ffd2";ctx.font="bold 14px Arial";ctx.fillText(lvlSub,lvlX+W*.44,HEADER_HEIGHT+44)}if(paused){ctx.fillStyle="#00dcff";ctx.font="bold 64px Arial";ctx.textAlign="center";ctx.fillText("PAUSED",W/2,GAME_HEIGHT/2)}if(!snake.alive){ctx.fillStyle="#ff2828";ctx.font="bold 64px Arial";ctx.textAlign="center";ctx.fillText("GAME OVER",W/2,GAME_HEIGHT/2-25);ctx.fillStyle="#fff";ctx.font="bold 24px Arial";ctx.fillText("TAP ANYWHERE TO RETRY",W/2,GAME_HEIGHT/2+40)}}}
let lastFrame=performance.now();
function loop(now){const dt=Math.min(22,Math.max(8,now-lastFrame));lastFrame=now;frameFactor=dt/16.67;timer+=.05*frameFactor;update();draw();requestAnimationFrame(loop)}

window.addEventListener("keydown",e=>{
  if(e.key==="["||e.key==="]"){

  }

function requestDirection(a){
  // Never allow a reverse/180° turn. A new direction must have a positive
  // dot product with the current travel direction (more than 90° is rejected).
  const d=(a-snake.angle+Math.PI)%TAU-Math.PI;
  if(Math.cos(d)<-0.15) return false;
  snake.target=a;
  return true;
}

function pointerPos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}
function applySkinWithoutReset(i){
  const len=snake.points.length;
  selectedColor=i;playerWormIndex=i;snake.form=i;snake.custom=SNAKE_SKINS[i].slice(1,4);
  if(snake.points.length!==len)snake.points.length=len;
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();let p=pointerPos(e),mx=p.x,my=p.y;if(audioCtx)audioCtx.resume();else try{audioCtx=new (AudioContext||webkitAudioContext)()}catch(_){};if(inMenu)setMusic("menu");
if(inMenu){
  if(wormPickerOpen){
    const by=H-70;if(my>=78&&my<=112&&mx>=220&&mx<=330){wormTeamSize=5;while(wormTeam.length>wormTeamSize)wormTeam.pop();while(wormTeam.length<wormTeamSize){let q=0;while(wormTeam.includes(q))q++;wormTeam.push(q);}if(!wormTeam.includes(playerWormIndex))playerWormIndex=wormTeam[0];saveWormTeam();return;}if(my>=78&&my<=112&&mx>=390&&mx<=500){if(currentStageNumber()<2){questText="7 WORMS UNLOCKS AT STAGE 2";questTimer=120;return;}wormTeamSize=7;while(wormTeam.length<wormTeamSize){let q=0;while(wormTeam.includes(q))q++;wormTeam.push(q);}saveWormTeam();return;}if(my>=by&&my<=by+50&&mx>=45&&mx<=325){if(wormTeam.length===wormTeamSize){wormPickerOpen=false;saveWormTeam();selectedColor=playerWormIndex;applySkinWithoutReset(selectedColor);}return;}if(my>=by&&my<=by+50&&mx>=395&&mx<=675){wormPickerOpen=false;return;}
    const cols=5,gw=124,gh=82,gap=10,x0=(W-(cols*gw+(cols-1)*gap))/2,y0=122;if(mx>=x0&&mx<=x0+cols*gw+(cols-1)*gap&&my>=y0&&my<y0+10*(gh+gap)){let c=Math.floor((mx-x0)/(gw+gap)),rr=Math.floor((my-y0)/(gh+gap)),i=rr*cols+c;if(i<50){
  const pos=wormTeam.indexOf(i);
  if(pos>=0){
    // Any of the five selected worms can become the player worm.
    playerWormIndex=i;selectedColor=i;
  }else if(wormTeam.length<wormTeamSize){
    wormTeam.push(i);
  }else{
    // Do not silently replace a selected worm: deselect one first.
    questText="TEAM FULL — TAP A SELECTED WORM TO PLAY AS IT";questTimer=120;
  }
  saveWormTeam();
}}return;
  }
  let bw=Math.min(660,W-44),bx=W/2-bw/2,start=105,menuGap=14,bh=88;let i=Math.floor((my-start)/(bh+menuGap));if(mx>=bx&&mx<=bx+bw&&i>=0&&i<10){menuPressed=i;menuPressedUntil=performance.now()+170;if(i===0){inMenu=false;snake.reset();applyStage(true);playFx("startgame");}else if(i===1){selectedColor=nextUnlockedSkin(1);playerWormIndex=selectedColor;if(!wormTeam.includes(selectedColor)){if(wormTeam.length<wormTeamSize)wormTeam.push(selectedColor);else wormTeam[0]=selectedColor;}saveWormTeam();applySkinWithoutReset(selectedColor);}else if(i===2){wormPickerOpen=true;}else if(i===3)selectedSpeed=(selectedSpeed+1)%4;else if(i===4)selectedControl=(selectedControl+1)%3;else if(i===5)selectedObjects=(selectedObjects+1)%5;else if(i===6){toggleMusic();}else if(i===7){toggleSfx();}else if(i===8){selectedDiff=(selectedDiff+1)%4;snake.maxLives=[5,3,2,1][selectedDiff];}else if(i===9){language=language==="en"?"ar":"en";localStorage.setItem("centipede_lang",language);}return;}
return;
}
let L=controlLayout();
// Speed editor is handled before game-over/steering, so it never becomes unresponsive.
if(speedMenuOpen){
  const x=75,y=GAME_HEIGHT+82,w=570,h=140;
  const minus=[x+38,y+70],plus=[x+w-38,y+70];
  if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h){
    if(dist(mx,my,...minus)<42) speedPercent=clamp(speedPercent-5,1,100);
    else if(dist(mx,my,...plus)<42) speedPercent=clamp(speedPercent+5,1,100);
    else speedPercent=clamp(Math.round((mx-(x+70))/(w-140)*100),1,100);
    return;
  }
  speedMenuOpen=false;
}
// The speed button itself is always available.
if(dist(mx,my,...L.speed)<=L.mainR+16){speedMenuOpen=true;return;}
if(!snake.alive){snake.reset();applyStage(true);playFx("startgame");return}
// Desktop mouse control: click in the play field to steer toward the cursor.  Gamepad: D-Pad/Left Stick = move, A = pause/start, B = boost.
if(e.pointerType==="mouse" && my>=HEADER_HEIGHT && my<GAME_HEIGHT){let dx=mx-snake.points[0][0],dy=my-snake.points[0][1];if(Math.hypot(dx,dy)>10){requestDirection(Math.atan2(dy,dx));}return}
if(mx>W-120&&my<80){paused=!paused;return}

for(let i=0;i<ps.length;i++) if(dist(mx,my,...ps[i])<=L.mainR+16){
  if(i===0){inMenu=true;return;}
  if(i===1)selectedControl=(selectedControl+1)%3;
  if(i===2){applySkinWithoutReset(nextUnlockedSkin(1));saveWormTeam();}
  if(i===3){toggleMusic();}
  return;
}
let pause=L.pause,boost=L.boost;if(dist(mx,my,...pause)<=L.sideR+24){paused=!paused;return}

if(selectedControl===0){
  const cx=L.dc[0],cy=L.dc[1],r=L.dpadR*.56;
  const dirs=[[cx,cy-r,-Math.PI/2,0],[cx,cy+r,Math.PI/2,1],[cx-r,cy,Math.PI,2],[cx+r,cy,0,3]];
  for(const [x,y,a,idx] of dirs){if(dist(mx,my,x,y)<=78){pressedDir=idx;pressedUntil=performance.now()+180;requestDirection(a);vibrate(25);return;}}
  if(dist(mx,my,cx,cy)<=L.dpadStick+18){drag=true;stick.x=mx;stick.y=my;const dx=mx-cx,dy=my-cy;if(Math.hypot(dx,dy)>12)requestDirection(Math.atan2(dy,dx));return;}
}
})

canvas.addEventListener("pointermove",e=>{if(!drag)return;let p=pointerPos(e),L=controlLayout(),dx=p.x-L.dc[0],dy=p.y-L.dc[1],m=Math.hypot(dx,dy),maxStick=L.dpadStick*.9;if(m>maxStick){p.x=L.dc[0]+dx*maxStick/m;p.y=L.dc[1]+dy*maxStick/m;dx=p.x-L.dc[0];dy=p.y-L.dc[1];m=maxStick;}stick.x=p.x;stick.y=p.y;if(m>12){requestDirection(Math.atan2(dy,dx));pressedDir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?1:0);pressedUntil=performance.now()+100;}})
canvas.addEventListener("pointerup",e=>{if(!inMenu&&selectedControl===1&&touchStart){let p=pointerPos(e),dx=p.x-touchStart.x,dy=p.y-touchStart.y;if(Math.hypot(dx,dy)>25)requestDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?0:Math.PI):(dy>0?Math.PI/2:-Math.PI/2))}drag=false;touchStart=null});

let gpLastDir=0,gpLastA=false,gpLastB=false,gpLastSkin=false;
function pollGamepad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[]; const g=[...pads].find(x=>x&&x.connected);
  if(!g)return;
  const ax=g.axes||[]; let x=Math.abs(ax[0]||0)>0.35?(ax[0]>0?1:-1):0, y=Math.abs(ax[1]||0)>0.35?(ax[1]>0?1:-1):0;
  let dir=0;
  if(g.buttons[12]?.pressed||y<0)dir=-Math.PI/2; else if(g.buttons[13]?.pressed||y>0)dir=Math.PI/2; else if(g.buttons[14]?.pressed||x<0)dir=Math.PI; else if(g.buttons[15]?.pressed||x>0)dir=0;
  if(dir!==0 && dir!==gpLastDir){requestDirection(dir);gpLastDir=dir;}
  if(dir===0)gpLastDir=0;
  const A=!!g.buttons[0]?.pressed,B=!!g.buttons[1]?.pressed;
  if(A&&!gpLastA){if(inMenu){inMenu=false;snake.reset();applyStage(true);playFx("startgame");}else paused=!paused;}
  if(B&&!gpLastB&&!inMenu){snake.boost=180;quest("USE BOOST");}
  gpLastA=A;gpLastB=B;
}
setInterval(pollGamepad,45);

addEventListener("keydown",e=>{if(e.key==="ArrowUp")requestDirection(-Math.PI/2);else if(e.key==="ArrowDown")requestDirection(Math.PI/2);else if(e.key==="ArrowLeft")requestDirection(Math.PI);else if(e.key==="ArrowRight")requestDirection(0);else if(e.code==="Space"){if(inMenu){inMenu=false;snake.reset();applyStage(true);playFx("startgame")}else paused=!paused}});
