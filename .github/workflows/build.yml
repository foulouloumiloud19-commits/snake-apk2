name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android Licenses & Build APK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "24333f8a635ba8e1520d1c4f72a4b18341e4573b\n893777656631aaf738f7311144f8d1673739f90f\n33b6aa24eb74603f18899c80547903f0d2324e10" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
          
