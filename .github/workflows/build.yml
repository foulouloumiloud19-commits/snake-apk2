name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libtinfo-dev lld
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Configure Android SDK & Accept Licenses
        run: |
          # تجهيز مسار buildozer للـ SDK وربطه مباشرة مع SDK السيرفر الجاهز
          mkdir -p ~/.buildozer/android/platform/android-sdk
          ln -sfn $ANDROID_HOME/cmdline-tools ~/.buildozer/android/platform/android-sdk/tools
          ln -sfn $ANDROID_HOME/platforms ~/.buildozer/android/platform/android-sdk/platforms
          ln -sfn $ANDROID_HOME/platform-tools ~/.buildozer/android/platform/android-sdk/platform-tools
          ln -sfn $ANDROID_HOME/build-tools ~/.buildozer/android/platform/android-sdk/build-tools

          # قبول جميع تراخيص أندرويد رسمياً وبشكل صامت
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

      - name: Build APK with Buildozer
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
          if-no-files-found: error
          
