name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libtinfo-dev lld
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Pre-accept Android Licenses Globally
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          echo -e "24333f8a635ba8e1520d1c4f72a4b18341e4573b\n893777656631aaf738f7311144f8d1673739f90f\n33b6aa24eb74603f18899c80547903f0d2324e10\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a635ba8e1520d1c4f72a4b18341e4573b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a3e80e4b2deee860d70800c014b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          printf 'y\ny\ny\ny\ny\ny\ny\n' | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
          if-no-files-found: error
          
